name: Shadow Operator Micro-Creator Discovery Agent

on:
  workflow_dispatch:
    inputs:
      niche_keywords:
        description: "Target 'Boring / High-Utility' Niche Keywords"
        required: true
        default: "excel automation pottery sourdough cad 3d printing bonsai notion acoustics mobility"
        type: string
      min_followers:
        description: "Minimum Follower Count"
        required: true
        default: "10000"
        type: string
      max_followers:
        description: "Maximum Follower Count"
        required: true
        default: "100000"
        type: string

permissions:
  contents: write

jobs:
  discover-and-rank-creators:
    name: Run 6-Algorithm Shadow Operator Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Scientific Computing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy

      - name: Run 5-Stage Diagnostic Self-Test Suite
        run: |
          python3 micro_creator_agent.py --self-test

      - name: Execute Micro-Creator Discovery & Monte Carlo Simulation
        run: |
          python3 micro_creator_agent.py \
            --niche "${{ github.event.inputs.niche_keywords || 'excel automation pottery sourdough cad 3d printing bonsai notion acoustics mobility leathercraft homelab' }}" \
            --min-followers "${{ github.event.inputs.min_followers || '10000' }}" \
            --max-followers "${{ github.event.inputs.max_followers || '100000' }}" \
            --output-csv sample_creators_report.csv \
            --output-json ranked_creators_full.json

      - name: Upload Ranked Micro-Creator Reports as Downloadable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shadow-operator-creator-prospects-${{ github.run_number }}
          path: |
            sample_creators_report.csv
            ranked_creators_full.json
          retention-days: 30

      - name: Save Generated CSV Report Back into Your Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sample_creators_report.csv ranked_creators_full.json
          git diff --staged --quiet || git commit -m "Auto-generate ranked micro-creator report"
          git push
